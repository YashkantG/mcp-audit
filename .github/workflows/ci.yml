name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - name: Smoke-test the CLI against its own vulnerable fixture
        run: |
          mcp-sentinel scan tests/fixtures/vulnerable_server --format json || true
          mcp-sentinel scan tests/fixtures/clean_server
