name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - name: Smoke-test the CLI against its own fixtures
        run: |
          mcp-sentinel scan tests/fixtures/vulnerable_server --format json || true
          mcp-sentinel scan tests/fixtures/clean_server

      - name: Dogfood — mcp-sentinel scans itself
        # Uses the repo's own .mcpsentinel.toml. If this fails, either we
        # introduced a real problem or a rule got noisier; both are worth
        # blocking on.
        run: mcp-sentinel scan .

      - name: Verify the committed self-scan badge is current
        if: matrix.python-version == '3.12'
        run: |
          mcp-sentinel scan . --format badge > /tmp/badge.json
          diff /tmp/badge.json .github/badges/self-scan.json \
            || (echo "::error::self-scan badge is stale — regenerate with: mcp-sentinel scan . --format badge > .github/badges/self-scan.json" && exit 1)
